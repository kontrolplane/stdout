# A single binary Loki for development: no auth, everything on the local filesystem.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Lets the label picker show how much each value ingested.
  volume_enabled: true
  discover_log_levels: true
  reject_old_samples: false

querier:
  # The picker and the tail may hold a few connections each.
  max_concurrent: 16

analytics:
  reporting_enabled: false
